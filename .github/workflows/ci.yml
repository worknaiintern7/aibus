name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "dev", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Test & Build Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Build Spring Boot with Maven
        run: |
          cd backend
          ./mvnw clean package -DskipTests

  customer-ci:
    name: Build Customer App (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: customer/package-lock.json

      - name: Install dependencies & build
        run: |
          cd customer
          npm ci
          npm run build

  admin-ci:
    name: Build Admin App (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies & build
        run: |
          cd admin
          npm ci
          npm run build
