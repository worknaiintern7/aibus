services:

  postgres:
    image: postgres:16-alpine
    container_name: aibus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aibus_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, set it in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aibus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aibus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aibus-backend:latest
    container_name: aibus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aibus_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, set it in .env}
      AIBUS_AUTH_URL: ${AIBUS_AUTH_URL}
      AIBUS_CLIENT_ID: ${AIBUS_CLIENT_ID}
      AIBUS_CLIENT_SECRET: ${AIBUS_CLIENT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:3001,http://localhost:3002}
    ports:
      - "8082:8080"
    networks:
      - aibus-network

  customer:
    build:
      context: ./customer
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_CUSTOMER_API_BASE_URL:-http://localhost:8080}
        VITE_AGENT_PORTAL_URL: ${VITE_AGENT_PORTAL_URL:-http://localhost:3002}
    image: aibus-customer:latest
    container_name: aibus-customer
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - aibus-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL:-http://localhost:8080}
    image: aibus-admin:latest
    container_name: aibus-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - aibus-network

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_AGENT_API_BASE_URL:-http://localhost:8080}
        VITE_CUSTOMER_APP_URL: ${VITE_CUSTOMER_APP_URL:-http://localhost:3000}
    image: aibus-agent:latest
    container_name: aibus-agent
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - aibus-network

volumes:
  postgres_data:

networks:
  aibus-network:
    driver: bridge