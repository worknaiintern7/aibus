spring.application.name=aibus-backend

server.port=${SERVER_PORT:8080}

# Local dev: load .env files (real environment variables still take precedence)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aibus_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# AIBus Provider API (the access token is generated from these at runtime)
aibus.auth.url=${AIBUS_AUTH_URL:https://partnerapi.iamgds.com/ota/v1/Auth}
aibus.client.id=${AIBUS_CLIENT_ID:}
aibus.client.secret=${AIBUS_CLIENT_SECRET:}

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost}